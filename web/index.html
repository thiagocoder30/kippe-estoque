<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIPPE WMS</title>
    <link rel="manifest" href="/web/manifest.json">
    <meta name="theme-color" content="#1a56b6">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/web/css/app.css">
    <style>
        .bg-kippe-blue { background-color: #1a56b6; }
        .text-kippe-blue { color: #1a56b6; }
        .bg-kippe-red { background-color: #e31c23; }
        .logo-kippe-sm { font-family: 'Arial Black', sans-serif; font-weight: 900; color: #e31c23; -webkit-text-stroke: 1.5px #ffffff; paint-order: stroke fill; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); transform: scaleY(1.15) skewX(-10deg); display: inline-block; }
        .logo-supermercado { font-family: 'Cooper Black', 'Georgia', serif; font-weight: 900; color: #ffffff; letter-spacing: 0.05em; transform: scaleY(0.85); display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20 uppercase">
    <header class="bg-kippe-blue text-white p-3 shadow-md sticky top-0 z-40 flex justify-between items-center border-b-4 border-kippe-red">
        <div class="flex flex-col leading-none ml-1">
            <span class="text-2xl logo-kippe-sm">KIPPE</span>
            <span class="text-[8px] logo-supermercado mt-1">Supermercado</span>
        </div>
        <button class="bg-[#124191] text-[10px] px-2 py-1.5 rounded-lg font-bold shadow-inner">ADMIN</button>
    </header>

    <main class="p-3 max-w-lg mx-auto space-y-3">
        <!-- TELA INICIAL -->
        <section id="home-module-view" class="space-y-3">
            <div class="bg-[#124191] text-white rounded-xl p-4 shadow-md border-l-4 border-kippe-red flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-black tracking-tight">Olá, ADMIN</h2>
                    <p class="text-blue-200 text-[9px] mt-0.5 font-bold">Painel Operacional WMS</p>
                </div>
                <span class="bg-white text-[#124191] text-[9px] px-2 py-1 rounded font-black">ADMIN</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="btn-module-inbound" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">1. RECEBER</h3>
                </button>
                <button class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95" onclick="alert('Armazenar: Sprint 4')">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">2. ARMAZENAR</h3>
                </button>
                <button class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95" onclick="alert('Use a Busca Rápida')">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">3. CONSULTA</h3>
                </button>
                <button class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95" onclick="alert('Relatórios: Sprint 4')">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">4. RELATÓRIOS</h3>
                </button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <label class="block text-[9px] font-black text-gray-500 mb-2 tracking-widest">BUSCA RÁPIDA</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="EAN OU NOME..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm font-mono font-bold outline-none">
                    <button id="searchBtn" class="bg-[#124191] text-white p-2.5 rounded-lg w-12 flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
                </div>
            </div>
        </section>

        <!-- TELA PRODUTO -->
        <section id="dashboard-view" class="hidden space-y-3">
            <button id="btn-back-dashboard" class="bg-white border px-3 py-1.5 rounded-lg font-bold text-[10px] shadow-sm">VOLTAR</button>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-kippe-blue">
                <h2 id="prodName" class="text-lg font-black text-gray-800"></h2>
                <p class="text-[9px] text-gray-500 mt-1">SKU: <span id="prodSku" class="font-mono font-black text-kippe-blue"></span></p>
                <div class="mt-3 pt-3 border-t border-gray-100">
                    <p class="text-[9px] font-bold text-gray-400 tracking-widest">SALDO NO DEPÓSITO</p>
                    <p id="stockTotal" class="text-4xl font-black text-[#124191] leading-none"></p>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL RECEBIMENTO -->
    <div id="receive-modal" class="hidden fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="bg-kippe-blue p-4 flex justify-between items-center text-white">
                <h3 class="font-black text-sm">ENTRADA DE ESTOQUE</h3>
                <button id="close-receive-modal" class="text-blue-200 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="p-5 space-y-3">
                <div>
                    <label class="text-[10px] font-bold text-gray-500">EAN / SKU</label>
                    <input type="text" id="rec-ean" class="w-full border rounded p-2 text-sm font-mono font-bold uppercase mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500">QUANTIDADE (+)</label>
                    <input type="number" id="rec-qty" class="w-full border rounded p-2 text-xl font-black text-kippe-blue mt-1 text-center" placeholder="0">
                </div>
                <button id="submit-receive" class="w-full bg-green-600 text-white font-black p-3 rounded-lg mt-2 active:scale-95 shadow-md">CONFIRMAR ENTRADA</button>
            </div>
        </div>
    </div>

    <!-- SPINNER -->
    <div id="loader" class="hidden fixed inset-0 z-[999] bg-white/80 flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-kippe-blue"></div>
        <p class="mt-4 font-black text-kippe-blue text-[10px]">PROCESSANDO...</p>
    </div>

    <script src="/web/js/app.js?v=sprint3" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIPPE WMS</title>
    <link rel="manifest" href="/web/manifest.json">
    <meta name="theme-color" content="#1a56b6">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/web/css/app.css">
    <script>
        // Imunidade anti-cache inicial
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister()));
    </script>
    <style>
        .bg-kippe-blue { background-color: #1a56b6; }
        .text-kippe-blue { color: #1a56b6; }
        .bg-kippe-red { background-color: #e31c23; }
        .logo-kippe-sm { font-family: 'Arial Black', sans-serif; font-weight: 900; color: #e31c23; -webkit-text-stroke: 1.5px #ffffff; paint-order: stroke fill; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); transform: scaleY(1.15) skewX(-10deg); display: inline-block; }
        .logo-supermercado { font-family: 'Cooper Black', 'Georgia', serif; font-weight: 900; color: #ffffff; letter-spacing: 0.05em; transform: scaleY(0.85); display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20 uppercase">
    <!-- HEADER -->
    <header class="bg-kippe-blue text-white p-3 shadow-md sticky top-0 z-40 flex justify-between items-center border-b-4 border-kippe-red">
        <div class="flex flex-col leading-none ml-1">
            <span class="text-2xl logo-kippe-sm">KIPPE</span>
            <span class="text-[8px] logo-supermercado uppercase mt-1">Supermercado</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="relative cursor-pointer mr-2 flex items-center justify-center">
                <svg class="w-6 h-6 text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span id="global-fefo-badge" class="hidden absolute -top-1 -right-1.5 bg-kippe-red text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center border shadow-md animate-pulse">0</span>
            </div>
            <button class="bg-[#124191] text-[10px] px-2 py-1.5 rounded-lg font-bold uppercase shadow-inner flex items-center gap-1 text-white">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                ADMIN
            </button>
        </div>
    </header>

    <main class="p-3 max-w-lg mx-auto space-y-3">
        <!-- TELA INICIAL (DASHBOARD) -->
        <section id="home-module-view" class="space-y-3">
            <div class="bg-[#124191] text-white rounded-xl p-4 shadow-md relative overflow-hidden border-l-4 border-kippe-red">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-black uppercase tracking-tight">Olá, ADMIN</h2>
                        <p class="text-blue-200 text-[9px] mt-0.5 uppercase font-bold">Painel Operacional WMS</p>
                    </div>
                    <span class="bg-white text-[#124191] text-[9px] px-2 py-1 rounded font-black shadow-sm">ADMIN</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95" onclick="alert('Módulo de Recebimento será conectado na Sprint 3!')">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">1. RECEBER</h3>
                </button>
                <button class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95" onclick="alert('Módulo de Armazenagem será conectado na Sprint 3!')">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">2. ARMAZENAR</h3>
                </button>
                <button class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95" onclick="alert('Módulo de Consulta será conectado na Sprint 3!')">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">3. CONSULTA</h3>
                </button>
                <button class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col items-center justify-center active:scale-95" onclick="alert('Módulo de Relatórios será ativado na Sprint 4!')">
                    <div class="bg-[#124191] text-white p-3 rounded-full mb-2 w-12 h-12 flex items-center justify-center"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                    <h3 class="font-black text-[#124191] text-[11px] text-center">4. RELATÓRIOS</h3>
                </button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <label class="block text-[9px] font-black text-gray-500 uppercase mb-2 tracking-widest">Busca Rápida</label>
                <div class="flex gap-2 relative">
                    <input type="text" id="searchInput" placeholder="EAN OU NOME..." autocomplete="off" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm font-mono font-bold uppercase outline-none">
                    <button id="searchBtn" class="bg-[#124191] text-white p-2.5 rounded-lg w-12 flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
                </div>
            </div>
        </section>
    </main>

    <!-- NAV INFERIOR -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-2 pb-safe z-40 uppercase">
        <button class="flex flex-col items-center text-[#124191] h-10 justify-center w-20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[9px] font-bold">Início</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 h-10 justify-center w-24" onclick="alert('Câmera será ativada na Sprint 3!')">
            <div class="bg-[#124191] p-3 rounded-full -mt-8 shadow-md border-4 border-white flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
            </div>
            <span class="text-[9px] font-bold mt-1">Scanner</span>
        </button>
    </nav>

    <script src="/web/js/app.js?v=sprint1" type="module"></script>
</body>
</html>

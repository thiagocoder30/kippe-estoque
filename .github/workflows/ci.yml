name: KIPPE WMS Enterprise CI

on:
  push:
    branches: [ main, master, recovery/architecture-reconciliation ]
  pull_request:
    branches: [ main, master, recovery/architecture-reconciliation ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    env:
      ENV: testing
      FLASK_ENV: testing

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-timeout

      - name: Configurar Node.js (Validação de Sintaxe JS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxe JS do Frontend
        run: |
          find web/js -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Executar Suíte Completa Pytest (Isolamento + RBAC + Core)
        run: |
          pytest -q
